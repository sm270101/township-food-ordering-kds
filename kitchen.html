<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HMEL Club House Kitchen Display (KDS)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center sticky top-0 z-10">
    <div>
      <h1 class="text-xl font-bold text-amber-400">Club House Kitchen Display (KDS)</h1>
      <p class="text-xs text-slate-400">HMEL Township Live Order Queue & Stock Control</p>
    </div>
    <button onclick="enableAudio()" id="audio-btn" class="bg-amber-500 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm">
      🔔 Enable Order Sound Alerts
    </button>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-4 gap-4 p-4">
    <div class="bg-slate-800/70 rounded-xl p-3 border border-slate-700">
      <h2 class="font-bold text-red-400 mb-3 uppercase text-xs tracking-wider">1. New Orders (Action Needed)</h2>
      <div id="col-placed" class="space-y-3"></div>
    </div>

    <div class="bg-slate-800/70 rounded-xl p-3 border border-slate-700">
      <h2 class="font-bold text-amber-400 mb-3 uppercase text-xs tracking-wider">2. Preparing in Kitchen</h2>
      <div id="col-accepted" class="space-y-3"></div>
    </div>

    <div class="bg-slate-800/70 rounded-xl p-3 border border-slate-700">
      <h2 class="font-bold text-emerald-400 mb-3 uppercase text-xs tracking-wider">3. Out with Runner</h2>
      <div id="col-out_for_delivery" class="space-y-3"></div>
    </div>

    <div class="bg-slate-800 rounded-xl p-3 border border-slate-700 flex flex-col max-h-[85vh]">
      <h2 class="font-bold text-sky-400 mb-2 uppercase text-xs tracking-wider">Live Menu Stock (138 Items)</h2>
      <input id="stock-search" oninput="renderStock()" type="text" placeholder="Filter dish to toggle stock..."
        class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-1.5 text-xs text-white mb-2.5 focus:outline-none focus:border-sky-400" />
      <div id="stock-list" class="space-y-2 overflow-y-auto pr-1 flex-1"></div>
    </div>
  </div>

  <script>
    let audioEnabled = false;
    let hasPendingOrders = false;
    let allStock = [];

    function enableAudio() {
      audioEnabled = true;
      playBeep();
      const btn = document.getElementById('audio-btn');
      btn.innerText = '🔊 Sound Alerts Active';
      btn.className = 'bg-emerald-600 text-white font-bold px-4 py-2 rounded-lg text-sm';
    }

    function playBeep() {
      if (!audioEnabled) return;
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.35);
    }

    setInterval(() => {
      if (audioEnabled && hasPendingOrders) playBeep();
    }, 4000);

    function minsAgo(isoString) {
      const diff = Math.max(0, Math.floor((Date.now() - new Date(isoString).getTime()) / 60000));
      return diff === 0 ? 'Just now' : `${diff}m ago`;
    }

    async function loadOrders() {
      const { data: orders } = await db
        .from('orders')
        .select('*, order_items(*)')
        .in('status', ['placed', 'accepted', 'out_for_delivery'])
        .order('created_at', { ascending: true });

      ['placed', 'accepted', 'out_for_delivery'].forEach(col => {
        document.getElementById('col-' + col).innerHTML = '';
      });

      hasPendingOrders = (orders || []).some(o => o.status === 'placed');

      (orders || []).forEach(order => {
        const itemsHtml = order.order_items.map(i => `<li>${i.quantity}x ${i.item_name}</li>`).join('');
        let actionBtns = '';

        if (order.status === 'placed') {
          actionBtns = `
            <div class="flex gap-2 mt-3">
              <button onclick="updateStatus('${order.id}', 'accepted')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-2 rounded font-bold text-sm">Accept</button>
              <button onclick="rejectOrder('${order.id}')" class="bg-red-600/80 hover:bg-red-600 px-3 py-2 rounded font-bold text-sm">Decline</button>
            </div>`;
        } else if (order.status === 'accepted') {
          actionBtns = `<button onclick="updateStatus('${order.id}', 'out_for_delivery')" class="w-full mt-3 bg-amber-500 text-slate-950 py-2 rounded font-bold text-sm">Dispatch with Runner →</button>`;
        } else if (order.status === 'out_for_delivery') {
          actionBtns = `<button onclick="updateStatus('${order.id}', 'delivered')" class="w-full mt-3 bg-sky-500 text-slate-950 py-2 rounded font-bold text-sm">Mark Delivered ✓</button>`;
        }

        const card = `
          <div class="bg-slate-900 p-3.5 rounded-lg border ${order.status === 'placed' ? 'border-red-500 animate-pulse' : 'border-slate-700'}">
            <div class="flex justify-between text-xs text-slate-400 mb-1">
              <span class="font-bold text-white">#${order.id.slice(0, 6).toUpperCase()} • ${minsAgo(order.created_at)}</span>
              <span>${order.payment_method} • ₹${order.total_amount}</span>
            </div>
            <p class="text-sm font-bold text-amber-300">${order.quarter_number}</p>
            <p class="text-xs text-slate-300 mb-2">${order.customer_name} (${order.customer_phone})</p>
            <ul class="text-sm space-y-1 border-t border-slate-800 pt-2">${itemsHtml}</ul>
            ${actionBtns}
          </div>`;
        document.getElementById('col-' + order.status).innerHTML += card;
      });
    }

    async function updateStatus(id, status) {
      await db.from('orders').update({ status }).eq('id', id);
      loadOrders();
    }

    async function rejectOrder(id) {
      const reason = prompt('Reason for declining (e.g., Paneer out of stock):', 'Item currently out of stock');
      if (reason === null) return;
      await db.from('orders').update({ status: 'cancelled', rejection_reason: reason }).eq('id', id);
      loadOrders();
    }

    async function loadStock() {
      const { data } = await db.from('menu_items').select('*').order('category').order('name');
      allStock = data || [];
      renderStock();
    }

    function renderStock() {
      const q = document.getElementById('stock-search').value.trim().toLowerCase();
      const filtered = allStock.filter(i => !q || i.name.toLowerCase().includes(q) || i.category.toLowerCase().includes(q));
      document.getElementById('stock-list').innerHTML = filtered.map(item => `
        <div class="flex justify-between items-center bg-slate-900 p-2.5 rounded-lg border border-slate-700 gap-2">
          <div class="min-w-0">
            <p class="text-xs font-semibold truncate">${item.name}</p>
            <p class="text-[11px] text-slate-400">${item.category} • ₹${item.price}</p>
          </div>
          <button onclick="toggleStock('${item.id}', ${!item.is_available})"
            class="px-2.5 py-1 rounded-full text-[11px] font-bold whitespace-nowrap ${item.is_available ? 'bg-emerald-600 text-white' : 'bg-red-900/60 text-red-300 border border-red-700'}">
            ${item.is_available ? 'IN STOCK' : 'SOLD OUT'}
          </button>
        </div>
      `).join('');
    }

    async function toggleStock(id, newState) {
      await db.from('menu_items').update({ is_available: newState }).eq('id', id);
      loadStock();
    }

    db.channel('kds-orders')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, () => {
        playBeep();
        setTimeout(loadOrders, 450);
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'orders' }, () => loadOrders())
      .subscribe();

    loadOrders();
    loadStock();
  </script>
</body>
</html>
